<div class="grid grid-cols-4 gap-4 p-4 containerHight overflow-auto">
    <div class="col-span-1 border p-3">
        <div class="agent-actions">
            <button class="add-agent-btn" mat-raised-button color="primary" (click)="addAgent()">
                <mat-icon matTooltip="Add Agent" svgIcon="mat:add"></mat-icon>
                <span>Add New Agent</span>
            </button>
            <div class="agent-type-filter">
                <select id="agentType" class="agent-type-select" [(ngModel)]="selectedAgentType" (change)="onAgentTypeChange()">
                    <option value="all">All</option>
                    <option value="text">Text</option>
                    <option value="voice">Voice</option>
                </select>
            </div>
        </div>
        <div *ngFor="let agent of agents,let i = index" class="flex justify-between items-center bg-slate-200 p-2 my-1 rounded-sm min-h-8 hover:bg-[#f3a649]" (click)="selectedAgent(i)" [ngClass]="{'selectedAgentBg': agent._id == SelectedAgent?._id}">
            <p class="text-base">{{agent.name}} </p>
            <div class="flex items-center gap-3">
                <mat-icon class="icon-lg" matTooltip="SubAgents Count" *ngIf="agent.subAgents?.length > 0" svgIcon="mat:group" matBadge="{{ agent.subAgents?.length || 0 }}" matBadgeColor="warn">
                </mat-icon>

                <mat-slide-toggle color="primary" matTooltip="Main Agent" (change)="setMainAgent(agent)" (click)="$event.stopPropagation()" [(ngModel)]="agent.mainAgent"></mat-slide-toggle>
                <button *ngIf="agent._id == SelectedAgent?._id" class="rounded-sm py-1 px-2 bg-[#FF7F27] text-base text-white hover:bg-slate-200 hover:text-black" (click)="onSubmit()">Save</button>
                <button (click)="deleteAgent(i, agent._id, $event)" matTooltip="Delete Agent"><mat-icon class="icon-lg" svgIcon="mat:delete" ></mat-icon></button>
            </div>

        </div>
    </div>

    <div id="agentFormScroll" class="agent-form-pane col-span-3 border h-full px-3 pb-3">
        <div class="agent-toolbar flex gap-4 items-center w-full overflow-x-auto overflow-y-hidden" *ngIf="form">
            <button class="mt-2 rounded-sm" *ngIf="form && SelectedAgent.parentAgentId == null" mat-stroked-button (click)="openSubAgentsDialog()">
                 Manage SubAgents
            </button>
            <button class="mt-2 rounded-sm" *ngIf="form" mat-stroked-button (click)="openToolDialog()">
                 Manage Tools
            </button>
            <button class="mt-2 rounded-sm" *ngIf="form" mat-stroked-button (click)="openStateDialog()">
                 State
            </button>
            <button *ngIf="form" class="mt-2 rounded-sm" mat-stroked-button (click)="viewFullPropmpt()">
                  View Full Prompt
            </button>
            <mat-slide-toggle color="primary" (change)="setHaveIntentRespone()" class="mt-2 " matTooltip="AI Intents" (click)="$event.stopPropagation()" [(ngModel)]="SelectedAgent.aiIntents">AI Intents</mat-slide-toggle>
            <mat-slide-toggle color="primary" (change)="setStartWithoutHistory()" class="mt-2 " matTooltip="Start Without History" (click)="$event.stopPropagation()" [(ngModel)]="SelectedAgent.startWithoutHistory">Start Without History</mat-slide-toggle>
            <mat-slide-toggle color="primary" (change)="setIsvoice()" class="mt-2 " matTooltip="Is Voice" (click)="$event.stopPropagation()" [(ngModel)]="SelectedAgent.isVoice">IS Voice</mat-slide-toggle>

            <!-- <mat-slide-toggle (change)="setHaveIntentRespone()" class="mt-2 " matTooltip="Intent Reponse" (click)="$event.stopPropagation()" [(ngModel)]="SelectedAgent.haveIntentRespone"></mat-slide-toggle>
            <button *ngIf="SelectedAgent.haveIntentRespone == true" class="mt-2 rounded-sm" mat-stroked-button (click)="viewIntentReponse()">
                  View Intent Reponse
            </button> -->
            <!-- <mat-checkbox (change)="setStartWithoutHistory()" color="primary" class="mx-8 mt-1" [(ngModel)]="SelectedAgent.startWithoutHistory"> <span class=" px-1 text-base">Start Without History</span></mat-checkbox> -->

        </div>

        <form *ngIf="form" [formGroup]="form" class="form-container agent-editor">
            <div class="editor-layout">
                <div class="prompt-tabs">
                    <button type="button" class="prompt-tab" [class.active]="selectedFormTab === 'details'" (click)="selectedFormTab = 'details'">
                        Details
                    </button>
                    <button type="button" class="prompt-tab" [class.active]="selectedFormTab === 'routing'" (click)="selectedFormTab = 'routing'">
                        Routing
                    </button>
                    <mat-divider ></mat-divider>
                    <p class="prompt-sections-title">Prompt Sections</p>
                    <button type="button" *ngFor="let section of promptSectionTabs" class="prompt-tab prompt-tab-with-count" [class.active]="selectedFormTab === section.key" (click)="selectedFormTab = section.key">
                        <span class="prompt-tab-label">{{ section.label }}</span>
                        <span class="prompt-tab-count" [class.empty]="sectionLength(section.key) === 0">{{ sectionLength(section.key) === 0 ? 'empty' : sectionLength(section.key) }}</span>
                    </button>
                </div>
                <div class="prompt-panel">
                    <div *ngIf="selectedFormTab === 'details'" class="panel-fill">
                        <div class="grid grid-cols-3 gap-4">
                            <mat-form-field appearance="fill" class="w-full ">
                                <mat-label>Name</mat-label>
                                <input matInput formControlName="name" />
                            </mat-form-field>
                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label>Provider</mat-label>
                                <mat-select (selectionChange)="selectProvider($event)" formControlName="provider">
                                    <mat-option *ngFor="let provider of aIModelsProvider" [value]="provider.provider">{{provider.provider}}</mat-option>
                                </mat-select>
                            </mat-form-field>
                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label>Model</mat-label>
                                <mat-select (selectionChange)="selectModel($event)" formControlName="model">
                                    <mat-option *ngFor="let model of ProviderModels" [value]="model.model">{{model.model}}</mat-option>
                                </mat-select>
                            </mat-form-field>
                            <mat-form-field appearance="fill" class="w-full col-span-2 ">
                                <mat-label>ApiKey</mat-label>
                                <input type="text" matInput formControlName="apiKey" />
                            </mat-form-field>
                            <mat-form-field appearance="fill" class="w-full ">
                                <mat-label>Max Memory Length</mat-label>
                                <input type="number" matInput formControlName="maxMemoryLength" />
                            </mat-form-field>
                        </div>
                    </div>
                    <div *ngIf="selectedFormTab === 'routing'" formArrayName="routing" class="panel-fill routing-panel">
                        <div *ngFor="let routeCtrl of routingControls.controls; let i = index" [formGroupName]="i" class=" rounded-md flex gap-4 items-center">
                            <mat-form-field appearance="fill" class="w-full mb-2">
                                <mat-label>Intent</mat-label>
                                <input matInput formControlName="intent" />
                            </mat-form-field>
                            <mat-form-field appearance="fill" class="w-full mb-2">
                                <mat-label>Task</mat-label>
                                <mat-select formControlName="taskId">
                                    <mat-option *ngFor="let task of tasks" [value]="task.intentId">{{task.name}}</mat-option>
                                </mat-select>
                            </mat-form-field>
                            <div class="w-full mb-3 overflow-x-auto">
                                <div class="flex gap-2 min-w-max">
                                    <div *ngFor="let v of routeCtrl.value.variables; let vi = index" class="flex items-center gap-2 border border-orange-400 bg-orange-50 px-3 py-1 rounded-full text-sm whitespace-nowrap">
                                        <span class="font-medium">{{ v.variableName }}</span>
                                        <span>:</span>
                                        <span>{{ v.value || '—' }}</span>
                                        <button mat-icon-button class="!w-5 !h-5" (click)="removeRoutingVariable(i, vi)">
                                            <mat-icon svgIcon="mat:close" class="text-red-500 text-sm"></mat-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button mat-icon-button class="mb-3" color="accent" (click)="openVariableValueDialog(routeCtrl.value, i)">
                                <mat-icon svgIcon="mat:tune" matTooltip="Set Variables" [matBadge]="routeCtrl.value.variables?.length" matBadgeColor="warn" [matBadgeHidden]="!routeCtrl.value.variables?.length"></mat-icon>
                            </button>
                            <button class="mb-3" mat-icon-button color="primary" (click)="removeRouting(i)">
                                <mat-icon matTooltip="Delete Routing" svgIcon="mat:delete"></mat-icon>
                            </button>
                        </div>
                        <div>
                            <button mat-button class=" bg-gray-500 text-white" color="primary" type="button" (click)="addRouting()"><mat-icon matTooltip="Add Routing" svgIcon="mat:add"></mat-icon> Add Routing </button>
                        </div>
                    </div>
                    <ng-container *ngFor="let section of promptSectionTabs">
                        <div *ngIf="selectedFormTab === section.key" formGroupName="promptSections" class="panel-fill prompt-fill">
                            <mat-form-field appearance="fill" class="fill-field">
                                <textarea matInput [formControlName]="section.key" class="font-mono prompt-textarea"></textarea>
                            </mat-form-field>
                        </div>
                    </ng-container>
                </div>
            </div>





            <!-- ///// -->
        </form>
    </div>
</div>
